# 기계 게이트 — 2호. LLM 0회, 비용 0, 항상 같은 답.
#
# 리뷰 에이전트의 판단력에 기대지 않고 막을 수 있는 것만 여기서 막는다.
# 필수 체크(required status check)로 등록해야 의미가 있다 — 등록하지 않으면
# 빨간 불이 떠도 머지되므로 게이트가 아니라 장식이다.
name: gates

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # 검사만 한다. 아무것도 쓰지 않는다.
    steps:
      - uses: actions/checkout@v6
        with:
          # 게이트는 워크트리가 아니라 **커밋 범위**를 본다. 얕은 클론이면
          # origin/main...HEAD 를 계산할 수 없다.
          fetch-depth: 0

      # base 가 main 이 아닌 PR 에서 게이트가 통째로 실패하면 fail closed 가 발동해
      # 정상 PR 이 전부 막힌다 — 게이트가 꺼지는 경로다. 기준을 실제 base 로 준다.
      - name: 베이스 브랜치 확보
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

      # gates/ 는 이 레포에 있어야 한다. 다른 레포에 이 워크플로를 복사할 때는
      # harness 의 gates/ 를 벤더링하거나 harness 를 공개로 돌려야 한다 —
      # 미해결 항목이다 (README 참조).
      - name: 게이트
        env:
          GATE_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: python3 gates/ci.py .
