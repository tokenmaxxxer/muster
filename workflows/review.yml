# 리뷰 에이전트 — 1호.
#
# 대상 레포의 .github/workflows/ 에 복사해 쓴다. harness 에서 도는 게 아니다.
#
# 규약: harness/protocol.md §5. 판단 규칙은 이 파일에 없다 —
# review-agent-rulebook/REVIEW.md 에 있고, 그 파일만 고치면 행동이 바뀐다.
name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 같은 PR 에 새 커밋이 밀려오면 낡은 리뷰는 버린다. 최신 diff 만 리뷰할 가치가 있다.
# 1판의 pipeline:<stage>:running 라벨 락과 stale 회수 로직 전체를 이 4줄이 대체한다.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # 쓰기는 PR 리뷰 제출까지만. contents: write 가 없으므로 코드를 밀 수 없고,
    # issues: write 가 없으므로 라벨을 바꿀 수 없다 (protocol.md §2).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # 게이트·리뷰 모두 커밋 범위를 봐야 한다

      # 룰북은 공개 레포라 토큰이 필요 없다.
      - name: 룰북 체크아웃
        uses: actions/checkout@v6
        with:
          repository: tokenmaxxxer/review-agent-rulebook
          path: .rulebook

      - name: 리뷰
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # 규칙 본문을 YAML 에 보간하지 않는다. 워크스페이스에 체크아웃돼 있으므로
          # 읽게 시키는 편이 낫다 — 룰북이 자라도 이 파일은 그대로다.
          prompt: |
            먼저 `.rulebook/REVIEW.md` 를 읽어라. 그것이 이 리뷰의 전체 규칙이며,
            아래 지시보다 우선한다.

            그다음 이 PR 의 diff 를 리뷰하라.
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            규칙의 핵심만 다시 적는다 (충돌 시 REVIEW.md 가 이긴다):
            - 침묵이 기본값이다. 지적 0건으로 끝나는 것이 정상이다.
            - 게시 전에 스스로 반증하라. 반박되면 게시하지 마라.
            - CI·린터·테스트·기계 게이트가 잡는 것은 말하지 마라.
            - 재현(입력 → 결과)을 못 쓰겠으면 그 지적은 버려라.
            - 승인·기각을 판정하지 마라. 머지는 사람이 한다.
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"

      # 원장: 비용·소요시간만 여기서 낸다. 나머지 지표(수용률·revert율)는
      # GitHub 에 이미 있으므로 ledger/collect.py 가 나중에 긁어간다.
      - name: 원장 기록
        if: always()
        # 신뢰할 수 없는 값(PR 제목·본문)은 여기에 넣지 않는다. 전부 숫자·SHA·리터럴이고,
        # 그마저도 셸 보간이 아니라 env 로 넘긴다 (protocol.md 불변식 5).
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CONCLUSION: ${{ steps.review.outcome }}
        run: |
          python3 - <<'PY' > entry.json
          import json, os, pathlib
          f = os.environ.get("EXEC_FILE") or ""
          cost = turns = None
          if f and pathlib.Path(f).exists():
              # 스키마가 바뀌어도 원장이 죽지 않게 방어적으로 훑는다.
              for line in pathlib.Path(f).read_text().splitlines():
                  try: obj = json.loads(line)
                  except ValueError: continue
                  if isinstance(obj, dict):
                      cost = obj.get("total_cost_usd", cost)
                      turns = obj.get("num_turns", turns)
          json.dump({
              "pr": int(os.environ["PR"]), "repo": os.environ["REPO"],
              "sha": os.environ["SHA"], "cost_usd": cost, "turns": turns,
              "conclusion": os.environ["CONCLUSION"],
          }, __import__("sys").stdout)
          PY
          cat entry.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: entry.json
          retention-days: 90
