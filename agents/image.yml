# 에이전트 이미지를 ghcr 로 올린다. 다른 에이전트 워크플로가 container: 로 당겨 쓴다.
#
# 이 워크플로만 harness 레포에서 돈다 — 나머지 agents/*.yml 은 대상 레포로 복사된다.
name: image

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/image.yml"]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images
          file: images/Dockerfile.agent
          push: true
          # latest 와 커밋 SHA 를 함께 단다. 워크플로는 SHA 로 고정해 쓰는 편이 낫다 —
          # latest 는 이미지가 바뀌면 리뷰 결과가 조용히 달라진다.
          tags: |
            ghcr.io/${{ github.repository_owner }}/harness-agent:latest
            ghcr.io/${{ github.repository_owner }}/harness-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
