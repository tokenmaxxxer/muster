# 리뷰 에이전트 — 1호. 대상 레포의 .github/workflows/ 에 복사해 쓴다.
#
# 이 파일에 판단이 없다는 점이 요점이다 (protocol.md §1). 절차·도구 권한·판단 기준은
# 전부 review-agent-rulebook 의 commands/review.md 에 있고, 여기는 배선만 한다.
# 리뷰 규칙을 바꾸려면 룰북만 고친다 — 이 파일도 harness 도 건드리지 않는다.
name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 새 커밋이 밀려오면 낡은 리뷰는 버린다. 1판의 :running 라벨 락과 stale 회수 로직
# 전체를 이 세 줄이 대체한다.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest

    # 경계 (protocol.md §3, 등급 A). 러너 기본 이미지에 깔린 aws·kubectl·ssh 키는
    # 에이전트가 임의 bash 를 돌릴 수 있는 이상 전부 공격면이다. 이 이미지에 없는
    # 것은 못 쓴다. egress 통제는 hosted 러너에서 불가능하다 — 그게 필요한 등급 B는
    # self-hosted 로 간다.
    container:
      image: ghcr.io/tokenmaxxxer/harness-agent:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 리뷰 제출까지만. contents:write 가 없어 코드를 밀 수 없고, issues:write 가
    # 없어 라벨을 바꿀 수 없다 (protocol.md §4).
    permissions:
      contents: read
      pull-requests: write

    steps:
      # 컨테이너 안에서는 uid 가 달라 git 이 워크스페이스를 "dubious ownership" 으로
      # 거부한다. checkout 전에 풀어 둔다.
      - run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 리뷰
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 이미지에 박아 둔 CLI 를 쓴다. 실행 시점 네트워크 설치가 없어지고,
          # 설치가 조용히 실패하는 열린 이슈를 우회한다.
          path_to_claude_code_executable: /usr/local/bin/claude
          plugin_marketplaces: https://github.com/tokenmaxxxer/review-agent-rulebook.git
          plugins: review@tokenmaxxxer-review
          # 프롬프트가 아니라 커맨드 호출이다. 인자는 숫자와 레포 이름뿐이라
          # 신뢰할 수 없는 값(제목·본문)이 셸에 닿지 않는다 (불변식 5).
          prompt: "/review:review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: --model opus

      # 원장: 비용·소요시간. 나머지 지표는 GitHub 에 이미 있으므로
      # ledger/collect.py 가 나중에 긁어간다.
      - name: 원장 기록
        if: always()
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CONCLUSION: ${{ steps.review.outcome }}
        run: |
          python3 - > entry.json <<'PY'
          import json, os, pathlib, sys
          f = os.environ.get("EXEC_FILE") or ""
          cost = turns = None
          if f and pathlib.Path(f).exists():
              # 스키마가 바뀌어도 원장이 죽지 않게 방어적으로 훑는다.
              for line in pathlib.Path(f).read_text().splitlines():
                  try:
                      obj = json.loads(line)
                  except ValueError:
                      continue
                  if isinstance(obj, dict):
                      cost = obj.get("total_cost_usd", cost)
                      turns = obj.get("num_turns", turns)
          json.dump({"repo": os.environ["REPO"], "pr": int(os.environ["PR"]),
                     "sha": os.environ["SHA"], "cost_usd": cost, "turns": turns,
                     "conclusion": os.environ["CONCLUSION"]}, sys.stdout)
          PY
          cat entry.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: entry.json
          retention-days: 90
