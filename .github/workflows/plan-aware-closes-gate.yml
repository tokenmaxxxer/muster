name: plan-aware-closes-gate

# issue #245: 계획-인지 Closes 게이트(gates/pr_reference.py, #228)를 머지 전에
# 강제로 실행되는 배선에 올린다 — 지금까지는 어떤 경로도 이 검사를 강제하지
# 않아 자문 스크립트에 불과했다. 이 워크플로 자체는 통과/차단 여부만
# 만든다; main 브랜치 보호 규칙에 이 체크 이름을 필수로 등록해야
# (Settings > Branches > Branch protection rules) 실제로 머지를 막는다 —
# 등록 전엔 상태만 보고되고 아무것도 막지 않는다. 정확한 등록 절차와
# 그것을 지금 이 PR에서 하지 않는 이유는
# docs/issue-245/reports/implementation.md 참조.
#
# `pull_request`(⟵ `pull_request_target` 아님)를 쓴다: 이 워크플로는 PR이
# 가져온 코드를 체크아웃도, 실행도 하지 않는다(아래 checkout은 항상
# `main`을 고정 참조한다) — 그래서 fork PR에서도 안전하게 돌고, 필요한
# 권한도 read 뿐이다.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  closes-gate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout gate script from main
        # PR이 아니라 항상 main을 체크아웃한다 — gates/ci.py 자체가 PR diff에
        # 포함돼 있으면, PR이 그 스크립트를 고쳐 자기 자신을 통과시킬 수
        # 있다(신뢰 경계 문제). closes-only 모드는 PR의 파일 diff를 전혀 보지
        # 않고 `gh pr view`/`gh issue view`/`gh api .../contents`로 메타데이터와
        # (phase-2 기록 한 건에 한해) 파일 내용을 읽으므로, PR의 코드 변경분을
        # 체크아웃할 필요 자체가 없다(issue #369: phase-2 기록도 PR head 브랜치를
        # `gh api`로 읽지, 로컬 워킹트리를 읽지 않는다).
        uses: actions/checkout@v4
        with:
          ref: main

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: plan-aware Closes gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 gates/ci.py . --pr "$PR_NUMBER" --autodetect --closes-only
