name: closure-sweep

# issue #383: gates/closure_sweep.py는 존재하고, 단위 테스트도 있고, 정확한
# 위반 상수까지 정의돼 있었지만 어떤 트리거에도 배선돼 있지 않았다
# (`grep -rn closure_sweep .github/`가 비어 있었다) — 맞는 체커가 아무도
# 부르지 않으면 없는 체커와 같다. 이 워크플로는 그 배선이다.
#
# PR별 체크(plan-aware-closes-gate.yml)와 다르게 이 스윕은 보드 전체(여러
# subject x role)를 훑는다 — 한 PR의 diff로는 판단할 수 없다. 그래서 PR
# 트리거가 아니라: main에 머지가 들어올 때마다(그 순간 새 위반이 생길 수
# 있는 시점), 그리고 그 사이에 놓친 것이 없도록 매일 한 번 스케줄로 돈다.
# `--post`로 위반이 있는 이슈에 코멘트를 달아 사람이 스윕을 기억해서
# 실행할 필요가 없게 한다.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  closure-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: closure-consistency sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 gates/closure_sweep.py --post
