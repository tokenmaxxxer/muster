# E2E용 어댑터 표 — 실행자만 결정론적 스크립트로 교체했다.
# 라우터·게이트·상태기계는 adapters.yml 과 완전히 동일한 코드가 돈다.
# 시나리오는 $SCENARIO 환경변수로 라우터에서 상속된다.
repo: tokenmaxxxer/orchestrator-e2e
poll_seconds: 3
stale_seconds: 900
max_attempts: 3

stages:
  plan:
    next: build
    contract: spec.md
    publish: comment
    cmd: bash "$ORCH/e2e/workers/plan.sh"

  build:
    next: review
    contract: summary.md
    publish: pr
    gates: [writeset, deps]
    cmd: bash "$ORCH/e2e/workers/build.sh"

  review:
    next: qa
    contract: verdict.json
    publish: merge
    verdict: true
    on_fail: build
    cmd: bash "$ORCH/e2e/workers/review.sh"

  qa:
    next: done
    contract: run.md
    publish: comment
    on_fail: build
    cmd: bash "$ORCH/e2e/workers/qa.sh"
