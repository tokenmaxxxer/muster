# 스테이지 → 실행자 표. 실행자 교체는 cmd 한 줄 교체.
# 라우터는 이 문자열을 실행하고 종료 코드와 $OUT 만 본다.
#
# 어댑터 작성 규칙 두 개 (E2E 에서 실제로 물린 것들):
#
# 1. 프롬프트는 stdin 으로. `--add-dir`·`--allowedTools` 같은 가변 인자 플래그가
#    뒤따르는 프롬프트를 인자로 삼켜 "Input must be provided" 로 죽는다.
# 2. 신뢰할 수 없는 값($TITLE 등)은 반드시 printf 의 인자로. 히어독이나 따옴표
#    없는 확장에 넣으면 제목 안의 $(...) 가 그대로 실행된다 — 이슈 제목은 누구나
#    쓸 수 있으므로 이건 원격 코드 실행이다.
repo: tokenmaxxxer/orchestrator-e2e
poll_seconds: 15
stale_seconds: 900
max_attempts: 2

# 워커에게 주입되는 환경: ISSUE TITLE OUT WORK SPEC PR ORCH
# 워커에게 주입되지 않는 것: GitHub 토큰 (게시는 라우터가 한다)
stages:
  plan:
    next: build
    contract: spec.md
    publish: comment
    cmd: |
      printf '이슈 #%s "%s" 의 구현 명세를 %s/spec.md 에 써라.
      현재 디렉터리가 대상 저장소다. 검증 가능한 요구사항만 번호로 적고,
      마지막에 write-set 을 "- write: <경로>" 형식으로 나열하라. 코드는 쓰지 마라.' \
        "$ISSUE" "$TITLE" "$OUT" |
      claude -p --output-format json --safe-mode \
        --permission-mode acceptEdits --add-dir "$OUT"

  build:
    next: review
    contract: summary.md
    publish: pr
    gates: [writeset, deps]
    # 계약은 경로가 아니라 내용으로 넘긴다. 워커의 샌드박스 허용 디렉터리는 work/ 와
    # out/ 뿐이라 $SPEC 경로를 주면 읽지 못하고 멈춘다(E2E 에서 실제로 멈췄다).
    # 셸은 라우터 권한으로 읽으므로 cat 은 성공하고, 워커는 경로 권한이 필요 없다.
    cmd: |
      printf '다음 명세를 이 저장소에 구현하라. 테스트도 함께 수정/추가하라.
      명세의 write-set 밖 파일은 건드리지 마라. 작업 요약을 %s/summary.md 에 써라.

      --- 명세 ---
      %s' "$OUT" "$(cat "$SPEC")" |
      claude -p --output-format json --safe-mode \
        --permission-mode acceptEdits --add-dir "$OUT"

  review:
    next: qa
    contract: verdict.json
    publish: merge
    verdict: true
    on_fail: build
    # 크로스모델: build 가 Claude 면 review 는 Codex. 같은 모델·같은 컨텍스트면
    # 자기 논리를 재승인할 뿐이라 독립성이 성립하지 않는다.
    cmd: |
      printf '`git diff origin/main` 을 확인해, 아래 명세의 각 요구사항이 충족되는지만
      판정하라. 코드 품질 평론은 하지 마라. 불확실하면 기각한다.
      {"approved": <bool>, "reason": "<한 줄>"} JSON 만 출력하라.

      --- 명세 ---
      %s' "$(cat "$SPEC")" |
      codex exec --sandbox read-only --skip-git-repo-check \
        -o "$OUT/verdict.json" -

  qa:
    next: done
    contract: run.md
    publish: comment
    on_fail: build
    cmd: |
      printf '이 저장소의 테스트를 실행하고, 명령·출력·판정(PASS/FAIL)을
      %s/run.md 에 기록하라. 테스트가 실패하면 고치지 말고 실패를 그대로 기록하라.' \
        "$OUT" |
      claude -p --output-format json --safe-mode \
        --permission-mode acceptEdits --add-dir "$OUT"
